<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>CarePulse - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "on-primary-fixed": "#131b2e",
                        "on-primary-fixed-variant": "#3f465c",
                        "primary": "#000000",
                        "on-error": "#ffffff",
                        "secondary-fixed": "#d8e2ff",
                        "on-tertiary-container": "#0c9488",

                        "inverse-primary": "#bec6e0",

                        "on-secondary-fixed-variant": "#004493",

                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",

                        "full": "0.75rem"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "container-max": "1440px",
                        "stack-lg": "32px",
                        "unit": "8px",
                        "stack-sm": "8px",
                        "gutter": "24px",
                        "margin-desktop": "32px",
                        "stack-md": "16px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter"],
                        "label-sm": ["Inter"],

        }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>

<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop font-body-md">
<!-- Container -->
<div class="max-w-[1000px] w-full mx-auto bg-surface rounded-xl overflow-hidden shadow-[0px_4px_12px_rgba(15,23,42,0.08)] border border-outline-variant flex flex-col md:flex-row h-[700px]">
<!-- Image Section (Hidden on Mobile) -->
<div class="hidden md:block md:w-1/2 relative bg-surface-container-highest">
<div class="absolute inset-0 bg-cover bg-center" data-alt="A clean, modern hospital corridor with soft, natural lighting filtering through large windows. The scene conveys a sense of calm professionalism, clinical precision, and reliability. The color palette features whites, light blues, and soft greys, aligning with a corporate modern medical aesthetic. High contrast and a utility-first mindset are apparent in the pristine environment." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBMH39uSiMCOUSDQW5mfvtc_zosgDoCgAA-jzcty3_kIqUSvQOi8wDIf7vIjfdtHJ0NWtD6GR0dS3f5e6sYD5l7iOal3bGljj9wB2mlKY1_W8-ub7iaBOJ8V3TASyqyezGej6LfzU9Ds9GioOUqddAx-Y3E0v4G723XR8sb4oW4WzuPpcO1aF1YMxVUmIndC2LR-BOgJ-fiMM3m3tQ1790bt-7j9S2ItEBkHHwic-RApavZr1kFLAXh')"></div>
<div class="absolute inset-0 bg-gradient-to-t from-primary-container/80 to-transparent flex flex-col justify-end p-margin-desktop text-on-primary">
<h2 class="font-headline-lg text-headline-lg mb-stack-sm text-on-primary">Clinical Precision.<br>Human Compassion.</h2>
<p class="font-body-lg text-body-lg text-on-primary/80">Streamlined data management for critical healthcare environments.</p>
</div>
</div>
<!-- Login Form Section -->
<div class="w-full md:w-1/2 p-margin-desktop flex flex-col justify-center bg-surface h-full">
<!-- Logo -->
<div class="mb-stack-lg flex items-center gap-unit">
<span class="material-symbols-outlined text-secondary text-[32px]" style="font-variation-settings: 'FILL' 1;">medical_services</span>
<span class="font-headline-md text-headline-md font-extrabold text-on-surface">CarePulse</span>
</div>
<div class="mb-stack-lg">
<h1 class="font-headline-sm text-headline-sm text-on-surface mb-stack-sm">Welcome Back</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Please log in to access the clinical management system.</p>
</div>
<form class="space-y-stack-md flex-1">
<!-- Role Selection -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-stack-sm">Select Role</label>
<div class="grid grid-cols-3 gap-unit">
<label class="cursor-pointer">
<input checked="" class="peer sr-only" name="role" type="radio" value="admin">
<div class="text-center py-2 px-3 border border-outline-variant rounded-DEFAULT font-label-sm text-label-sm text-on-surface-variant peer-checked:border-secondary peer-checked:bg-secondary-fixed peer-checked:text-on-secondary-fixed transition-colors">
                                Admin
                            </div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="role" type="radio" value="doctor">
<div class="text-center py-2 px-3 border border-outline-variant rounded-DEFAULT font-label-sm text-label-sm text-on-surface-variant peer-checked:border-secondary peer-checked:bg-secondary-fixed peer-checked:text-on-secondary-fixed transition-colors">
                                Doctor
                            </div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="role" type="radio" value="receptionist">
<div class="text-center py-2 px-3 border border-outline-variant rounded-DEFAULT font-label-sm text-label-sm text-on-surface-variant peer-checked:border-secondary peer-checked:bg-secondary-fixed peer-checked:text-on-secondary-fixed transition-colors">
                                Receptionist
                            </div>
</label>
</div>
</div>
<!-- Email / Username -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-stack-sm" for="username">Email or Username</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">person</span>
</span>
<input class="block w-full pl-10 pr-3 py-2 border border-outline-variant rounded-DEFAULT bg-surface text-on-surface focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary font-body-sm text-body-sm transition-colors" id="username" placeholder="Enter your credentials" type="text">
</div>
</div>
<!-- Password -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-stack-sm" for="password">Password</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">lock</span>
</span>
<input class="block w-full pl-10 pr-3 py-2 border border-outline-variant rounded-DEFAULT bg-surface text-on-surface focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary font-body-sm text-body-sm transition-colors" id="password" placeholder="••••••••" type="password">
</div>
</div>
<!-- Forgot Password & Submit -->
<div class="flex items-center justify-between mt-stack-sm mb-stack-lg">
<div class="flex items-center">
<input class="h-4 w-4 rounded border-outline-variant text-secondary focus:ring-secondary cursor-pointer" id="remember-me" name="remember-me" type="checkbox">
<label class="ml-2 block font-body-sm text-body-sm text-on-surface-variant cursor-pointer" for="remember-me">
                            Remember me
                        </label>
</div>
<div class="font-body-sm text-body-sm">
<a class="font-label-md text-label-md text-secondary hover:text-on-secondary-fixed-variant transition-colors" href="#">Forgot Password?</a>
</div>
</div>
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-DEFAULT shadow-sm font-label-md text-label-md text-on-secondary bg-secondary hover:bg-on-secondary-fixed-variant focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-secondary transition-colors" type="submit">
                    Login to System
                </button>
</form>
<div class="mt-stack-lg text-center font-label-sm text-label-sm text-outline">
                © 2024 CarePulse Hospital Management System. Restricted Access.
            </div>
</div>
</div>
</body></html>
