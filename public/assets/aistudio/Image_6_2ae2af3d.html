</div>
<form class="space-y-4 flex-1">
<!-- Role Selection -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2">Select Role</label>
<div class="grid grid-cols-3 gap-2">
<label class="cursor-pointer">
<input checked="" class="peer sr-only" name="role" type="radio" value="admin">
<div class="text-center py-2 px-3 border border-outline-variant rounded-DEFAULT font-label-sm text-label-sm text-on-surface-variant peer-checked:border-secondary peer-checked:bg-secondary-fixed peer-checked:text-on-secondary-fixed transition-colors">
                                Admin
                            </div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="role" type="radio" value="doctor">
<div class="text-center py-2 px-3 border border-outline-variant rounded-DEFAULT font-label-sm text-label-sm text-on-surface-variant peer-checked:border-secondary peer-checked:bg-secondary-fixed peer-checked:text-on-secondary-fixed transition-colors">Receptionist</div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="role" type="radio" value="receptionist">
<div class="text-center py-2 px-3 border border-outline-variant rounded-DEFAULT font-label-sm text-label-sm text-on-surface-variant peer-checked:border-secondary peer-checked:bg-secondary-fixed peer-checked:text-on-secondary-fixed transition-colors">Doctor</div>
</label>
</div>
</div>

<label class="block font-label-md text-label-md text-on-surface mb-2" for="username">Email or Username</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">person</span>
</span>
<input class="block w-full pl-10 pr-3 py-2 border border-outline-variant rounded-DEFAULT bg-surface text-on-surface focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary font-body-sm text-body-sm transition-colors" id="username" placeholder="Enter your credentials" type="text">
</div>
</div>
<!-- Password -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="password">Password</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">lock</span>
</span>
<input class="block w-full pl-10 pr-3 py-2 border border-outline-variant rounded-DEFAULT bg-surface text-on-surface focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary font-body-sm text-body-sm transition-colors" id="password" placeholder="••••••••" type="password">
</div>
